<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 2 Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Gallery</h1>
    <p>A collection of images for Project 2.</p>
  </header>

  <main>
    <section>
      <h2>Featured Image</h2>
      <picture>
        <source
          media="(max-width: 600px)"
          srcset="images/pexels-loquellano-12404963-square.jpg">
        <img
          src="images/pexels-loquellano-12404963.jpg"
          alt="Featured photograph">
      </picture>
    </section>

    <section>
      <h2>Image Gallery</h2>
      <div class="image-grid">
        <figure>
          <img src="images/pexels-kelsey-caroline-774981359-19122990.jpg" alt="First gallery photograph">
          <figcaption>Image 1</figcaption>
        </figure>

        <figure>
          <img src="images/pexels-loquellano-12404963.jpg" alt="Second gallery photograph">
          <figcaption>Image 2</figcaption>
        </figure>

        <figure>
          <img src="images/pexels-malcolmhill-12360516.jpg" alt="Third gallery photograph">
          <figcaption>Image 3</figcaption>
        </figure>

        <figure>
          <img src="images/pexels-mora-versio-2150673251-34091093.jpg" alt="Fourth gallery photograph">
          <figcaption>Image 4</figcaption>
        </figure>

        <figure>
          <img src="images/pexels-tracehudson-2424391.jpg" alt="Fifth gallery photograph">
          <figcaption>Image 5</figcaption>
        </figure>

        <figure>
          <img src="images/praswin-prakashan-YOCN1a1m_dg-unsplash.jpg" alt="Sixth gallery photograph">
          <figcaption>Image 6</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Video</h2>
      <div class="video-container">
        <iframe
          src="https://www.youtube-nocookie.com/embed/ScMzIvxBSi4"
          title="YouTube video"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </main>
</body>
</html>
